<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click2Drive | {{ 'Sign Up' if active_tab == 'signup' else 'Login' }}</title>
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body>

<!-- VIDEO BACKGROUND -->
<div class="video-bg">
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="https://www.pexels.com/download/video/3571264/" type="video/mp4">
    </video>
    <div class="video-fallback" id="videoFallback"></div>
    <div class="video-overlay" id="videoOverlay"></div>
</div>

<!-- AUTH PAGE -->
<div class="auth-page">
    <div class="auth-card">

        <!-- SUCCESS OVERLAY -->
        <div class="success-overlay" id="successOverlay">
            <div class="success-icon">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="success-text" id="successText">Welcome!</div>
        </div>

        <!-- LOGO -->
        <div class="auth-logo">
            <a href="{{ url_for('home') }}">CLICK<span>2</span>DRIVE</a>
        </div>
        <p class="auth-tagline">Your Drive Starts Here</p>

        <!-- TABS -->
        <div class="auth-tabs">
            <button class="tab-btn {% if active_tab != 'signup' %}active{% endif %}" id="tabLogin" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn {% if active_tab == 'signup' %}active{% endif %}" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
            <div class="tab-indicator {% if active_tab == 'signup' %}on-signup{% endif %}" id="tabIndicator"></div>
        </div>

        <!-- FORMS -->
        <div class="auth-forms">

            <!-- LOGIN FORM -->
            <div class="auth-form {% if active_tab == 'signup' %}hidden{% endif %}" id="loginForm">

                {% if login_error %}
                <div class="flash-message error shake" id="loginFlash">{{ login_error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('login') }}" onsubmit="handleSubmit(this)">
                    <input type="hidden" name="form_type" value="login">

                    <div class="input-group {% if request.form.get('email') and active_tab != 'signup' %}has-value{% endif %}">
                        <input type="email" name="email" id="loginEmail" autocomplete="email"
                               value="{{ request.form.get('email', '') if active_tab != 'signup' else '' }}"
                               oninput="toggleHasValue(this)">
                        <label for="loginEmail">Email Address</label>
                    </div>

                    <div class="input-group password-group {% if request.form.get('password') and active_tab != 'signup' %}has-value{% endif %}">
                        <input type="password" name="password" id="loginPassword" autocomplete="current-password"
                               oninput="toggleHasValue(this)">
                        <label for="loginPassword">Password</label>
                        <button type="button" class="toggle-password" onclick="togglePwd('loginPassword', this)">
                            <svg id="eyeIconLogin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="remember-row">
                        <label class="custom-check">
                            <input type="checkbox" name="remember">
                            <span class="check-box">
                                <svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"></polyline></svg>
                            </span>
                            Remember Me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="auth-btn" id="loginBtn">
                        <span class="btn-text">Log In</span>
                        <span class="btn-spinner"><span class="spinner-ring"></span></span>
                    </button>
                </form>

                <p class="switch-link">
                    New to Click2Drive? <a href="#" onclick="switchTab('signup'); return false;">Sign Up</a>
                </p>
            </div>

            <!-- SIGNUP FORM -->
            <div class="auth-form {% if active_tab != 'signup' %}hidden{% endif %}" id="signupForm">

                {% if signup_error %}
                <div class="flash-message error shake" id="signupFlash">{{ signup_error }}</div>
                {% endif %}

                {% if signup_success %}
                <div class="flash-message success">{{ signup_success }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('signup') }}" onsubmit="handleSubmit(this)">
                    <input type="hidden" name="form_type" value="signup">

                    <div class="input-row">
                        <div class="input-group {% if request.form.get('first_name') and active_tab == 'signup' %}has-value{% endif %}">
                            <input type="text" name="first_name" id="firstName" autocomplete="given-name"
                                   value="{{ request.form.get('first_name', '') if active_tab == 'signup' else '' }}"
                                   oninput="toggleHasValue(this)">
                            <label for="firstName">First Name</label>
                        </div>
                        <div class="input-group {% if request.form.get('last_name') and active_tab == 'signup' %}has-value{% endif %}">
                            <input type="text" name="last_name" id="lastName" autocomplete="family-name"
                                   value="{{ request.form.get('last_name', '') if active_tab == 'signup' else '' }}"
                                   oninput="toggleHasValue(this)">
                            <label for="lastName">Last Name</label>
                        </div>
                    </div>

                    <div class="input-group {% if request.form.get('signup_email') and active_tab == 'signup' %}has-value{% endif %}">
                        <input type="email" name="signup_email" id="signupEmail" autocomplete="email"
                               value="{{ request.form.get('signup_email', '') if active_tab == 'signup' else '' }}"
                               oninput="toggleHasValue(this)">
                        <label for="signupEmail">Email Address</label>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" name="signup_password" id="signupPassword"
                               autocomplete="new-password"
                               oninput="toggleHasValue(this); checkStrength(this.value)">
                        <label for="signupPassword">Password</label>
                        <button type="button" class="toggle-password" onclick="togglePwd('signupPassword', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="password-strength">
                        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>

                    <div class="input-group password-group">
                        <input type="password" name="confirm_password" id="confirmPassword"
                               autocomplete="new-password"
                               oninput="toggleHasValue(this)">
                        <label for="confirmPassword">Confirm Password</label>
                        <button type="button" class="toggle-password" onclick="togglePwd('confirmPassword', this)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="terms-row">
                        <label class="custom-check">
                            <input type="checkbox" name="terms" id="termsCheck" required>
                            <span class="check-box">
                                <svg viewBox="0 0 12 12"><polyline points="2 6 5 9 10 3"></polyline></svg>
                            </span>
                            I agree to the <a href="#">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="auth-btn" id="signupBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-spinner"><span class="spinner-ring"></span></span>
                    </button>
                </form>

                <p class="switch-link">
                    Already have an account? <a href="#" onclick="switchTab('login'); return false;">Log In</a>
                </p>
            </div>

        </div><!-- /auth-forms -->
    </div><!-- /auth-card -->
</div><!-- /auth-page -->

<script>
// ── TAB SWITCHING ──
function switchTab(tab) {
    const loginForm  = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const indicator  = document.getElementById('tabIndicator');
    const tabLogin   = document.getElementById('tabLogin');
    const tabSignup  = document.getElementById('tabSignup');

    if (tab === 'signup') {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        indicator.classList.add('on-signup');
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        setTimeout(() => document.getElementById('firstName').focus(), 50);
    } else {
        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        indicator.classList.remove('on-signup');
        tabSignup.classList.remove('active');
        tabLogin.classList.add('active');
        setTimeout(() => document.getElementById('loginEmail').focus(), 50);
    }
}

// ── FLOATING LABELS ──
function toggleHasValue(input) {
    input.parentElement.classList.toggle('has-value', input.value.length > 0);
}

// Init has-value on page load
document.querySelectorAll('.input-group input').forEach(input => {
    if (input.value) input.parentElement.classList.add('has-value');
});

// ── PASSWORD TOGGLE ──
function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.innerHTML = isText
        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
             <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
             <circle cx="12" cy="12" r="3"></circle>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
             <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"></path>
           </svg>`;
}

// ── PASSWORD STRENGTH ──
function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    if (!val) { fill.style.width = '0%'; text.textContent = ''; return; }

    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const levels = [
        { w: '25%', c: '#f40552', t: 'Weak' },
        { w: '50%', c: '#ff8800', t: 'Fair' },
        { w: '75%', c: '#f4c842', t: 'Good' },
        { w: '100%', c: '#05f464', t: 'Strong' },
    ];
    const lvl = levels[score - 1] || levels[0];
    fill.style.width = lvl.w;
    fill.style.background = lvl.c;
    text.textContent = lvl.t;
    text.style.color = lvl.c;
}

// ── SUBMIT LOADING ──
function handleSubmit(form) {
    const btn = form.querySelector('.auth-btn');
    btn.classList.add('loading');

    // client-side password match check for signup
    if (form.querySelector('#signupPassword')) {
        const p1 = document.getElementById('signupPassword').value;
        const p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            btn.classList.remove('loading');
            showFlash('signupFlash', 'Passwords do not match.');
            document.getElementById('confirmPassword').classList.add('input-error');
            return false;
        }
    }
}

function showFlash(id, msg) {
    let el = document.getElementById(id);
    if (!el) {
        el = document.createElement('div');
        el.id = id;
        el.className = 'flash-message error';
        const form = document.querySelector('#signupForm form, #loginForm form');
        form.prepend(el);
    }
    el.textContent = msg;
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 500);
}

// ── SUCCESS ANIMATION ──
{% if login_success or signup_success_redirect %}
window.addEventListener('load', () => {
    const overlay = document.getElementById('successOverlay');
    document.getElementById('successText').textContent = '{{ "Welcome back!" if login_success else "Account created!" }}';
    overlay.classList.add('show');
    setTimeout(() => { window.location.href = "{{ url_for('home') }}"; }, 1800);
});
{% endif %}

// ── VIDEO FALLBACK ──
const video = document.getElementById('bgVideo');
video.addEventListener('error', () => {
    video.style.display = 'none';
    document.getElementById('videoFallback').style.display = 'block';
});

// ── PARALLAX OVERLAY ON MOUSE MOVE ──
document.addEventListener('mousemove', (e) => {
    const overlay = document.getElementById('videoOverlay');
    const xPct = e.clientX / window.innerWidth;
    const yPct = e.clientY / window.innerHeight;
    const alpha1 = 0.8 + (xPct * 0.1);
    const alpha2 = 0.4 + (yPct * 0.15);
    overlay.style.background = `linear-gradient(
        ${105 + xPct * 20}deg,
        rgba(0,0,0,${alpha1}) 0%,
        rgba(0,0,0,${alpha2}) 50%,
        rgba(0,0,0,0.75) 100%
    )`;
});

// ── AUTO FOCUS ──
window.addEventListener('load', () => {
    const firstInput = document.querySelector('.auth-form:not(.hidden) input:not([type=hidden])');
    if (firstInput) firstInput.focus();
});
</script>
</body>
</html>
